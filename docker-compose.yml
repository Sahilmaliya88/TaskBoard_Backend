version: '3'
services:
  nginx:
    image: nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - node-app
  node-app:
    build: .
    volumes:
      - .:/app:ro
    depends_on:
      - mongo
      - Redis
  Redis:
    image: redis:latest
    ports:
      - "6379:6379"
    