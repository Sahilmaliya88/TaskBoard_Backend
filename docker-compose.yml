version: '3'
services:
  nginx:
    image: nginx
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - node-app
  node-app:
    build: .
    volumes:
      - .:/app:ro
    depends_on:
      - mongo
      - redis
    environment:
      - REDIS_HOST:redis,
      - REDIS_PORT:6379
  redis:
    image: redis
    ports:
      - "6379:6379"
    